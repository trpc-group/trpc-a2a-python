[build-system]
requires = ["setuptools>=64.0", "wheel", "hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "trpc_a2a/version.py"

[project]
name = "trpc-a2a"
dynamic = ["version"]
description = "TRPC Microservice Control Protocol implementation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "tRPC Group"}]
keywords = ["trpc", "agent", "microservice"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "trpc-python ; sys_platform != 'win32'",
    "trpc_fastapi",
    "pydantic>=2.11.3",
    "fastapi>=0.115.2",
    "google-api-core>=1.26.0",
    "grpcio>=1.60",
    "grpcio-reflection>=1.7.0",
    "grpcio-tools>=1.60",
    "httpx>=0.28.1",
    "httpx-sse>=0.4.0",
    "opentelemetry-api>=1.33.0",
    "opentelemetry-sdk>=1.33.0",
    "protobuf>=5.29.5",
    "sse-starlette>=2.3.6",
    "starlette>=0.46.2",
    "uvicorn>=0.35.0",
    "a2a-sdk>=0.3.5",
    "opentelemetry-instrumentation-fastapi",
]

[project.optional-dependencies]
redis = [
   "redis>=6.2.0",
   "trpc_redis>=0.2.0a0"
]
dev = [
    "setuptools",
    "pytest",
    "black",
    "flake8",
    "yapf"
]

all = [
    "setuptools",
    "pytest",
    "redis>=6.2.0",
    "trpc_redis>=0.2.0a0"
]

# Use include so both packages are packaged.
[tool.hatch.build.targets.wheel]
packages = ["trpc_a2a"]

[project.urls]
Homepage = ""
Documentation = ""
Repository = ""



# Include non-code files such as data and templates when present.
[tool.setuptools.package-data]
"*" = ["*.txt", "*.md", "*.yml", "*.yaml"]

# Optional tool configuration.
[tool.black]
line-length = 120
target-version = ['py310']
exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | venv
  | env
  | node_modules
)/
'''

[tool.yapf]
based_on_style = "pep8"
column_limit = 120
indent_width = 4
split_before_logical_operator = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = ["tests"]
